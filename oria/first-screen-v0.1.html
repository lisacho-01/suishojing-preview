<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORIA | First Screen v0.1</title>
  <style>
    :root {
      --ivory: #f4efe7;
      --paper: #fbf8f1;
      --sage: #858c7b;
      --gold: #a77a34;
      --charcoal: #2f2a25;
      --ink-soft: rgba(251, 248, 241, 0.84);
      --line-light: rgba(251, 248, 241, 0.28);
      --line-dark: rgba(47, 42, 37, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--charcoal);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--paper);
      background: var(--charcoal);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.58;
    }

    a,
    button {
      color: inherit;
      font: inherit;
    }

    a {
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .page {
      min-height: 100svh;
      background:
        linear-gradient(180deg, rgba(47, 42, 37, 0.08) 0%, rgba(47, 42, 37, 0.64) 54%, rgba(47, 42, 37, 0.9) 100%),
        url("../assets/ai-visuals/C001/2026-07-07/C001-ai-visual-v3-fullscreen-ui.png") center / cover;
    }

    .header {
      position: fixed;
      z-index: 10;
      top: 32px;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      min-height: 64px;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid rgba(251, 248, 241, 0.12);
      background: rgba(47, 42, 37, 0.22);
      backdrop-filter: blur(14px);
    }

    .top-gift {
      position: fixed;
      z-index: 11;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border-bottom: 1px solid rgba(251, 248, 241, 0.12);
      background: rgba(47, 42, 37, 0.72);
      color: rgba(251, 248, 241, 0.82);
      font-size: 11px;
      font-weight: 700;
    }

    .brand {
      justify-self: center;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .icon-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
    }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      display: block;
      width: 19px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .menu-icon::before {
      transform: translateY(-6px);
    }

    .menu-icon::after {
      transform: translateY(5px);
    }

    .bag-icon {
      position: relative;
      width: 18px;
      height: 19px;
      border: 1.4px solid currentColor;
      border-radius: 2px 2px 6px 6px;
    }

    .bag-icon::before {
      position: absolute;
      top: -8px;
      left: 4px;
      width: 8px;
      height: 8px;
      border: 1.4px solid currentColor;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      content: "";
    }

    .hero {
      display: grid;
      min-height: 100svh;
      align-items: end;
      padding: 96px 20px 28px;
    }

    .hero-inner {
      width: min(100%, 460px);
    }

    .kicker {
      margin: 0 0 14px;
      color: rgba(251, 248, 241, 0.72);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      color: var(--paper);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
      font-size: 46px;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-light);
      border-radius: 999px;
      padding: 0 22px;
      background: rgba(251, 248, 241, 0.1);
      color: var(--paper);
      font-size: 14px;
      font-weight: 700;
    }

    .button-primary {
      border-color: rgba(167, 122, 52, 0.72);
      background: var(--gold);
      color: #fffaf0;
    }

    .primary-action {
      margin: 0 0 26px;
    }

    .secondary-action {
      margin-top: 24px;
    }

    .signals {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      color: rgba(251, 248, 241, 0.72);
      font-size: 11px;
    }

    .signals span {
      border: 1px solid rgba(251, 248, 241, 0.22);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(47, 42, 37, 0.16);
    }

    @media (min-width: 720px) {
      .header {
        min-height: 72px;
        padding: 0 42px;
      }

      .brand {
        font-size: 30px;
      }

      .hero {
        padding: 120px 54px 42px;
      }

      .hero-inner {
        width: min(100%, 620px);
      }

      h1 {
        max-width: 11ch;
        font-size: 76px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
      }

      .button {
        min-width: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-gift">Opening Gift｜診断後に初回ギフトをお届け</div>
    <header class="header" aria-label="ORIA header">
      <button class="icon-button" type="button" aria-label="Menu"><span class="menu-icon"></span></button>
      <a class="brand" href="#">ORIA</a>
      <button class="icon-button" type="button" aria-label="Cart"><span class="bag-icon"></span></button>
    </header>

    <main class="hero">
      <section class="hero-inner" aria-labelledby="hero-title">
        <div class="primary-action" aria-label="Primary action">
          <a class="button button-primary" href="#diagnosis">診断をはじめる</a>
        </div>
        <p class="kicker">AI Crystal Diagnosis</p>
        <h1 id="hero-title">今の気持ちに、静かな石を。</h1>
        <div class="actions secondary-action" aria-label="Secondary action">
          <a class="button" href="#collection">Collection を見る</a>
        </div>
        <div class="signals" aria-label="Trust signals">
          <span>天然石セレクト</span>
          <span>日本国内で検品</span>
          <span>Opening Gift</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
